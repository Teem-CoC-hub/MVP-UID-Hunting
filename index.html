<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One-Tap Number Copy</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --border:#2a2f3a;
    --accent:#3b82f6;
    --accent2:#22c55e;
    --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    width:min(920px, 94%);
    margin:24px auto 50px;
  }
  h1{
    margin:0 0 6px;
    font-size:28px;
  }
  .sub{
    margin:0 0 18px;
    color:var(--muted);
  }
  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    margin-bottom:16px;
  }
  textarea{
    width:100%;
    min-height:130px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    font-size:17px;
    line-height:1.5;
    outline:none;
    background:#101318;
    color:#f3f4f6;
  }
  textarea:focus,input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  button{
    border:0;
    border-radius:11px;
    padding:12px 16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
  }
  .primary{background:var(--accent); color:white}
  .secondary{background:#2a2f3a; color:#f3f4f6}
  .danger{background:#3a1f24; color:#fecaca}
  .copyBtn{
    width:100%;
    background:var(--accent2);
    color:white;
    min-height:48px;
  }
  .copyBtn.copied{
    background:#0b0d12;
  }
  table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
  }
  th,td{
    padding:10px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none}
  th{
    background:#1f2633;
    text-align:left;
    font-size:14px;
    color:#d1d5db;
  }
  th:last-child{text-align:center}
  .numInput{
    width:100%;
    min-height:48px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:18px;
    outline:none;
    background:#101318;
    color:#f3f4f6;
  }
  .rowActions{
    display:grid;
    grid-template-columns:1fr 42px;
    gap:8px;
    align-items:center;
  }
  .delBtn{
    min-height:48px;
    padding:0;
    background:#2b171b;
    color:#fda4af;
    border:1px solid #7f1d1d;
  }
  .hint{
    font-size:13px;
    color:var(--muted);
    margin-top:8px;
  }

  textarea::placeholder, .numInput::placeholder{
    color:#6b7280;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:#0b0d12;
    color:white;
    padding:10px 14px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
    font-weight:700;
    z-index:1000;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  @media (max-width:600px){
    .wrap{width:96%; margin-top:12px}
    h1{font-size:22px}
    .panel{padding:12px}
    th,td{padding:8px}
    th:first-child{width:62%}
    th:last-child{width:38%}
    .numInput{font-size:17px}
    button{font-size:15px}
    .rowActions{grid-template-columns:1fr}
    .delBtn{min-height:38px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>MVP UID Hunting</h1>
  <p class="sub">Paste UID list then tap <b>Generate Table</b>.</p>

  <div class="panel">
    <textarea id="bulkInput" placeholder="Example:
0812345678
0899999999
AC5680611
123456789"></textarea>
    <div class="controls">
      <button class="primary" onclick="generateFromList()">Generate Table</button>
      <button class="secondary" onclick="addRow()">+ Add Row</button>
      <button class="danger" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Number / Text</th>
        <th>One-Tap Copy</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
const STORAGE_KEY = "oneTapCopyRows_v1";

function getRows(){
  return [...document.querySelectorAll(".numInput")].map(i => i.value);
}

function saveRows(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(getRows()));
}

function renderRows(rows){
  const body = document.getElementById("tableBody");
  body.innerHTML = "";
  rows.forEach(value => createRow(value));
  if(rows.length === 0) createRow("");
  saveRows();
}

function createRow(value=""){
  const body = document.getElementById("tableBody");
  const tr = document.createElement("tr");

  const tdNum = document.createElement("td");
  const input = document.createElement("input");
  input.className = "numInput";
  input.type = "text";
  input.value = value;
  input.autocomplete = "off";
  input.spellcheck = false;
  input.addEventListener("input", saveRows);
  tdNum.appendChild(input);

  const tdAction = document.createElement("td");
  const actionWrap = document.createElement("div");
  actionWrap.className = "rowActions";

  const copy = document.createElement("button");
  copy.className = "copyBtn";
  copy.textContent = "COPY";
  copy.addEventListener("click", () => copyText(input.value, copy));

  const del = document.createElement("button");
  del.className = "delBtn";
  del.textContent = "×";
  del.title = "Delete row";
  del.addEventListener("click", () => {
    tr.remove();
    if(document.querySelectorAll("#tableBody tr").length === 0) createRow("");
    saveRows();
  });

  actionWrap.appendChild(copy);
  actionWrap.appendChild(del);
  tdAction.appendChild(actionWrap);

  tr.appendChild(tdNum);
  tr.appendChild(tdAction);
  body.appendChild(tr);
}

function generateFromList(){
  const raw = document.getElementById("bulkInput").value;
  const rows = raw
    .split(/\r?\n/)
    .map(v => v.trim())
    .filter(v => v.length > 0);
  if(rows.length === 0){
    showToast("Paste a list first");
    return;
  }
  renderRows(rows);
  document.getElementById("bulkInput").value = "";
}

function addRow(){
  createRow("");
  saveRows();
  const inputs = document.querySelectorAll(".numInput");
  inputs[inputs.length - 1].focus();
}

async function copyText(text, btn){
  if(!text){
    showToast("Nothing to copy");
    return;
  }

  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    document.execCommand("copy");
    temp.remove();
  }

  const old = btn.textContent;
  btn.textContent = "COPIED ✓";
  btn.classList.add("copied");
  showToast("Copied: " + text);
  setTimeout(() => {
    btn.textContent = old;
    btn.classList.remove("copied");
  }, 1000);
}

function clearAll(){
  if(confirm("Clear all rows?")){
    localStorage.removeItem(STORAGE_KEY);
    renderRows([""]);
    document.getElementById("bulkInput").value = "";
  }
}

function showToast(message){
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.remove("show"), 1200);
}

(function init(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const rows = JSON.parse(saved);
      renderRows(Array.isArray(rows) && rows.length ? rows : [""]);
      return;
    }catch(e){}
  }
  renderRows([""]);
})();
</script>
</body>
</html>
